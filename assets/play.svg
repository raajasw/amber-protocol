<svg xmlns="http://www.w3.org/2000/svg" width="330" height="64" viewBox="0 0 330 64"
     role="img" aria-label="Play Amber Protocol">
  <title>Play Amber Protocol</title>
  <!-- the console's own palette: dark-adapted amber on slate -->
  <rect x="0" y="0" width="330" height="64" rx="6" fill="#F0A93B"/>
  <path d="M30 20 L30 44 L51 32 Z" fill="#111419"/>
  <!-- textLength pins the width, so a different fallback font cannot overflow -->
  <text x="68" y="40" fill="#111419"
        font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="20" font-weight="700" letter-spacing="0.2"
        textLength="222" lengthAdjust="spacingAndGlyphs">Play Amber Protocol</text>
</svg>
